apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workspace
  namespace: argocd
spec:
  project: workspace
  source:
    repoURL: https://github.com/nhn-academy-workspace/workspace-manifests.git
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: workspace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
