# 예시/문서용 — 실제 값은 절대 git에 커밋하지 말 것.
# 이 파일은 참고용이라 argocd Application에서 이 디렉토리를 sync해도 이 파일 자체는
# 실제 배포에 안 쓰이도록 이름을 .example.yaml로 둠(아래 안내대로 kubectl로 직접 생성).
#
# 실행 예시:
#
# kubectl create secret generic workspace-secrets \
#   --namespace workspace \
#   --from-literal=db-root-password='...' \
#   --from-literal=db-user='...' \
#   --from-literal=db-password='...' \
#   --from-literal=telegram-bot-token='...' \
#   --from-literal=telegram-bot-username='academy_reservation_bot' \
#   --from-literal=telegram-webhook-secret='...'
#
# kubectl create secret docker-registry ghcr-secret \
#   --namespace workspace \
#   --docker-server=ghcr.io \
#   --docker-username=<github-id> \
#   --docker-password=<GHCR write:packages PAT>
#
# 값은 기존 서버 ~/deploy-secrets/workspace-booking.env에서 그대로 가져올 것.
# TELEGRAM_BOT_TOKEN/TELEGRAM_WEBHOOK_SECRET을 바꾸지 않으면 텔레그램 웹훅 재등록도 불필요.
apiVersion: v1
kind: Secret
metadata:
  name: workspace-secrets
  namespace: workspace
type: Opaque
stringData:
  db-root-password: "REPLACE_ME"
  db-user: "REPLACE_ME"
  db-password: "REPLACE_ME"
  telegram-bot-token: "REPLACE_ME"
  telegram-bot-username: "academy_reservation_bot"
  telegram-webhook-secret: "REPLACE_ME"
