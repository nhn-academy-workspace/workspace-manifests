apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: workspace
spec:
  replicas: 1
  selector:
    matchLabels: { app: cloudflared }
  template:
    metadata:
      labels: { app: cloudflared }
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          resources:
            requests: { memory: "32Mi", cpu: "25m" }
            limits: { memory: "64Mi", cpu: "100m" }
